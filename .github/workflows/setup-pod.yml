name: Setup Pod

# Runs against YOUR OWN Cloudflare account, using YOUR OWN credentials, on a
# GitHub-hosted runner. BasalMind never sees the token below -- it lives only
# in this repo's own GitHub Actions secrets, encrypted by GitHub, readable
# only inside this workflow run.
#
# Manually triggered, not run on every push -- setting up a pod is a
# deliberate action the owner takes, not a side effect of editing a README.
on:
  workflow_dispatch:
    inputs:
      owner_did:
        description: "Your pod DID (did:webvh:...). Bound as OWNER_DID; the pod initializes itself from it on first boot and the owner can never be changed afterwards."
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check the owner DID is a well-formed did:webvh
        env:
          OWNER_DID: ${{ inputs.owner_did }}
        run: |
          if ! printf '%s' "$OWNER_DID" | grep -Eq '^did:webvh:[A-Za-z0-9]+(:[A-Za-z0-9._%-]+)+$'; then
            echo "owner_did must look like did:webvh:<SCID>:<domain>[:<path>...]"
            exit 1
          fi

      - name: Deploy pod-root to your Cloudflare account
        uses: cloudflare/wrangler-action@v4
        env:
          OWNER_DID: ${{ inputs.owner_did }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          vars: OWNER_DID

      - name: Confirm the pod answers
        run: |
          echo "Deployed. The pod initializes itself on first boot. Visit your Worker's *.workers.dev URL + /status to confirm and read its public service_key."
